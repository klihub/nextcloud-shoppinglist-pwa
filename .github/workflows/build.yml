name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'android/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Prepare Nextcloud stylesheet path
        run: |
          mkdir -p css
          cp js/main.css css/main.css
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: shoppinglist-frontend
          path: |
            js/main.js
            css/main.css

  go-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test Go client
        working-directory: go-client
        run: |
          gofmt -w client.go client_test.go mobilebridge/bridge.go cmd/integration-test/main.go
          go vet ./...
          go test -race ./...

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find lib appinfo -name '*.php' -print0 | xargs -0 -n1 php -l

  app-package:
    needs: [frontend, php-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shoppinglist-frontend
          path: .
      - name: Assemble Nextcloud app package
        run: |
          mkdir -p package/shoppinglist
          cp -R appinfo lib templates js css img package/shoppinglist/
          cp composer.json manifest.webmanifest icon.svg sw.js package/shoppinglist/
          cd package
          zip -qr ../shoppinglist-app.zip shoppinglist
      - name: Upload Nextcloud app package
        uses: actions/upload-artifact@v4
        with:
          name: shoppinglist-nextcloud-app
          path: shoppinglist-app.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Go mobile tools
        working-directory: go-client/mobilebridge
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go list -f '{{.Name}} {{.Dir}}' golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
      - name: Build Go Android library
        working-directory: go-client/mobilebridge
        run: |
          mkdir -p ../../android/app/libs
          gomobile bind -target=android -javapkg=com.klihub.shoppinglist -o ../../android/app/libs/mobilebridge.aar .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android app
        run: gradle -p android assembleDebug
